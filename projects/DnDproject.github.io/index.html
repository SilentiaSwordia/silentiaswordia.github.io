<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="bootstrap-scoped.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Momo+Trust+Sans&display=swap");
    </style>
    <link rel="stylesheet" href="styles.css" />
    <title>Monster Search</title>
  </head>
  <body>
    <div class="container">
      <div class="monsterContainer" id="monsterContainer">
        <h1 id="monsterTitle">Monster Search</h1>
        <div class="searchContainer">
          <input
            type="text"
            id="monsterInput"
            placeholder="Enter a monster name"
            autocomplete="off"
          />
          <div id="suggestions" class="suggestionsList"></div>
        </div>
        <button id="searchButton">Search</button>
        <div id="monsterResult" class="monsterResult"></div>
      </div>
      <div id="currencyContainer" class="currency-container">
        <h1 id="currencyTitle">Currency Converter</h1>
        <div class="searchContainer">
          <input
            type="text"
            id="currencyInput"
            placeholder="Enter a currency"
            autocomplete="off"
          />
          <div id="currencySuggestions" class="currencySuggestionsList"></div>
        </div>
        <button id="currencySearchButton">Convert</button>
        <div id="currencyResult" class="currencyResult"></div>
      </div>
      <div id="shanaContainer" class="shanaContainer">
        <h1 id="shanaTitle">Inspiration</h1>
        <div class="shanaInspPicsContainer" id="shanaInspPicsContainer"></div>
        <div class="shanaQuoteContainer">
          <p id="shanaQuote"></p>
          <p id="shanaAuthor"></p>
        </div>
        <button id="shanaButton">New Inspiration</button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
    <div
      class="bootstrap-scope"
      style="position: fixed; bottom: 0; left: 0; padding: 1rem; z-index: 1080"
    >
      <a
        href="../../index.html"
        class="btn btn-primary"
        style="
          text-decoration: none;
          background-color: #0d6efd;
          color: white;
          padding: 0.375rem 0.75rem;
          border-radius: 0.375rem;
          display: inline-block;
        "
        >&larr; Back to Home</a
      >
    </div>
  </body>
</html>
